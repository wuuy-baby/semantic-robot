ekf_filter_node:
  ros__parameters:
    use_sim_time: true

    frequency: 30.0

    two_d_mode: true

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom
    imu0: /imu

    odom0_config:
      [
        true,  true,  false,
        false, false, false,
        true,  false, false,
        false, false, false,
        false, false, false
      ]

    imu0_config:
      [
        false, false, false,
        false, false, true,
        false, false, false,
        false, false, true,
        false, false, false
      ]

    odom0_queue_size: 10
    imu0_queue_size: 10

    imu0_remove_gravitational_acceleration: true
